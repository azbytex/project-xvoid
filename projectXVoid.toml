[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-xvoid"
version = "1.2"
description = "PROJECT-XVOID terminal & web toolkit"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "rich>=13.7.0",
]

[project.scripts]
project-xvoid = "dashboard:main"
